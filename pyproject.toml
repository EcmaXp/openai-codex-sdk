[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-codex-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Codex APIs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
keywords = ["openai", "codex", "sdk", "python", "api"]
dependencies = [
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/openai/codex"
Repository = "https://github.com/openai/codex"

[tool.hatch.build.targets.wheel]
packages = ["sdk/python/src/openai_codex_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sdk/python/tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pyright>=1.1",
]
